<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ventiver Servicios</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body.fondo {
    font-family: 'Poppins', Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
    background:
        repeating-linear-gradient(
            135deg,
            rgba(0,51,102,0.04),
            rgba(0,51,102,0.04) 10px,
            rgba(255,255,255,0.4) 10px,
            rgba(255,255,255,0.4) 20px
        ),
        linear-gradient(180deg, #f4f8fc, #eef3f9);
}

/* HEADER */
header {
    background: #003366;
    color: #fff;
    padding: 30px 20px 45px;
    text-align: center;
    position: relative;
}
.logo img { width: 200px; }

/* BOTONES */
.top-buttons {
    position: absolute;
    top: 20px;
    right: 25px;
    display: flex;
    gap: 12px;
}
.top-buttons a {
    color: #fff;
    font-size: 13px;
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 5px;
    background: rgba(255,255,255,0.15);
}

/* HERO */
.main-content {
    text-align: center;
    padding: 90px 20px;
}
.main-content h2 {
    font-size: 40px;
    font-weight: 600;
}
.main-content p {
    max-width: 700px;
    margin: 15px auto 0;
    font-size: 17px;
    opacity: 0.9;
}
.hero-line {
    width: 80px;
    height: 4px;
    background: #003366;
    margin: 25px auto;
    border-radius: 2px;
}
.btn-primary {
    background: #003366;
    color: #fff;
    padding: 16px 40px;
    border-radius: 8px;
    text-decoration: none;
    display: inline-block;
    margin-top: 25px;
    transition: 0.3s;
}
.btn-primary:hover {
    background: #00509e;
    transform: translateY(-2px);
}

/* ================== MODO EMERGENCIA CORPORATIVO ================== */
#emergenciaOverlay{
    position:fixed;
    inset:0;
    background:rgba(0,51,102,0.25);
    backdrop-filter: blur(6px);
    z-index:99999;
    display:flex;
    align-items:center;
    justify-content:center;
}

.emergencia-box{
    text-align:center;
    max-width:520px;
    width:92%;
    background:#ffffff;
    border-radius:14px;
    padding:28px;
    box-shadow:0 25px 60px rgba(0,0,0,0.35);
    border-top:6px solid #003366;
    font-family:'Poppins', sans-serif;
}

.emergencia-gear{
    font-size:55px;
    animation:spin 2s linear infinite;
    margin-bottom:10px;
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

.emergencia-title{
    color:#003366;
    font-size:22px;
    font-weight:600;
    margin-bottom:6px;
}

.emergencia-sub{
    font-size:13px;
    color:#666;
    margin-bottom:15px;
}

.emergencia-console{
    background:#f4f8fc;
    border:1px solid #d6e2f0;
    height:150px;
    overflow:hidden;
    padding:10px;
    font-size:12px;
    text-align:left;
    border-radius:8px;
    margin-bottom:20px;
    color:#003366;
    font-family:monospace;
}

.btn-emergencia{
    background:#003366;
    border:none;
    color:#fff;
    padding:12px 22px;
    border-radius:8px;
    cursor:pointer;
    font-weight:500;
    box-shadow:0 6px 15px rgba(0,51,102,0.3);
}
.btn-emergencia:hover{
    background:#00509e;
}
</style>
</head>

<body class="fondo">

<!-- ======= CONTENIDO REAL DETRÁS ======= -->
<header>
    <div class="logo">
        <img src="logo-removebg-preview.png" alt="Ventiver">
    </div>

    <div class="top-buttons">
        <a href="#">Servicios</a>
        <a href="#">Contacto</a>
    </div>
</header>

<section class="main-content">
    <h2>Sistemas de Ventilación Industrial</h2>
    <div class="hero-line"></div>
    <p>
        Instalación de ductería, extractores, aislamiento térmico y soluciones de ventilación profesional para industria.
    </p>

    <a href="#" class="btn-primary">Solicitar cotización</a>
</section>


<!-- 🔴 EMERGENCIA CORPORATIVA -->
<div id="emergenciaOverlay">
    <div class="emergencia-box">

        <img src="logo-removebg-preview.png" style="width:120px;margin-bottom:10px;">

        <div class="emergencia-gear">⚙️</div>

        <div class="emergencia-title">Interrupción temporal del servicio</div>
        <div class="emergencia-sub">
            Estamos verificando el estado del sistema Ventiver
        </div>

        <div id="emergenciaConsole" class="emergencia-console"></div>

        <button class="btn-emergencia" onclick="location.href='soporte.html'">
            Contactar soporte técnico
        </button>
    </div>
</div>

<script>
const consola=document.getElementById("emergenciaConsole");

const logs=[
"[Sistema] Inicializando servicios...",
"[Ventiver] Verificando módulos de ventilación",
"[Control] Validando parámetros térmicos",
"[Red] Conectividad inestable detectada",
"[Sistema] Reintentando conexión...",
"[Seguridad] Validación interna en curso",
"[Estado] Servicios temporalmente limitados",
"[Sistema] Esperando respuesta del servidor...",
"[Ventiver] Módulos en proceso de recuperación"
];

setInterval(()=>{
    const linea=document.createElement("div");
    linea.textContent="> "+logs[Math.floor(Math.random()*logs.length)];
    consola.appendChild(linea);
    consola.scrollTop=consola.scrollHeight;
},700);

document.body.style.overflow="hidden";
</script>

</body>
</html>

</html>
